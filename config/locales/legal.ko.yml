ko:
  legal:
    effective_date: "시행일: %{date}"
    contact_title: "문의"
    contact_body: "정책과 서비스에 관한 문의는 다음 주소로 보내 주세요."
    footer:
      navigation: "정책 및 문의"
    registration:
      agree_to_terms: "이용약관에 동의합니다. (필수)"
      consent_required: "이용약관에 동의해야 가입할 수 있습니다."
    privacy:
      title: "개인정보 처리방침"
      intro: "책짹은 일반 회원에게 독서·커뮤니티 서비스를 제공하기 위해 개인정보를 처리합니다."
      sections:
        - title: "처리하는 정보"
          paragraphs:
            - >-
              가입할 때 초대 이메일, 이름, 공개 주소, 비밀번호, 약관 동의 시각·버전을 처리합니다. 회원이 선택한 프로필 이미지와 책장·독서 기록·게시물·댓글·좋아요·관계·알림도 처리합니다.
            - >-
              접속 시 IP 주소, 요청 시각·경로를 기록합니다. 비밀번호 재설정과 운영 조치에는 필요한 요청 정보, 대상·처리자·사유·시각을 처리합니다.
        - title: "처리 목적과 근거"
          paragraphs:
            - >-
              초대 확인, 계정·독서·소통 기능 제공, 알림·운영 메일 발송과 문의 응대에 사용합니다. 서비스 제공에 필요한 정보는 이용계약의 체결·이행을 위해 처리합니다. 보안·부정 이용 대응과 운영 조치는 관련 법령이 허용하는 범위에서 수행하고, 법적 의무가 있으면 그 이행에 필요한 정보를 처리합니다.
        - title: "보유와 파기"
          paragraphs:
            - >-
              서비스 이용 중 정보를 보유합니다. 탈퇴하면 계정의 이름·이메일을 대체하고 아바타·책장·독서 기록·관계·알림을 정리합니다. 탈퇴자와 연결된 초대 및 같은 이메일의 과거 초대는 이메일을 비식별 주소로 바꾸고 계정 연결을 해제합니다. 글과 댓글은 익명 작성자의 콘텐츠로 남고 기존 공개 주소는 비공개로 예약됩니다. 법령상 보존 의무가 있는 정보는 그 범위에서 처리합니다.
        - title: "외부 서비스"
          paragraphs:
            - >-
              OCI는 서비스 운영과 아바타 저장에, Cloudflare는 접속 중계·보안에, Resend는 초대·비밀번호 재설정 메일 발송에 사용합니다. 이에 따라 접속 정보나 수신 이메일 주소·메일 내용 등 해당 업무에 필요한 정보가 처리됩니다.
            - >-
              도서 검색어는 Kakao 도서 검색 API로 전달됩니다. 외부 표지 이미지를 볼 때 브라우저가 이미지 제공자에 접속할 수 있습니다.
        - title: "쿠키"
          paragraphs:
            - >-
              로그인 유지에 필요한 세션 쿠키를 사용합니다. 브라우저에서 쿠키를 거부하면 로그인 기능을 이용하지 못할 수 있습니다.
        - title: "안전조치"
          paragraphs:
            - >-
              HTTPS, 비밀번호 보호, 개인정보의 로그 노출 제한, 비공개 파일 저장과 서버 접근 권한 검사를 적용합니다.
        - title: "이용자의 권리"
          paragraphs:
            - >-
              회원은 계정 설정에서 제공되는 정보를 관리하고 탈퇴할 수 있습니다. 개인정보 열람·정정·삭제·처리정지 요청은 아래 문의처로 보내 주세요. 법령상 제한이 있으면 그 이유를 안내합니다.
    terms:
      title: "이용약관"
      intro: "이 약관은 일반 회원의 책짹 베타 서비스 이용에 적용됩니다."
      sections:
        - title: "계정과 가입"
          paragraphs:
            - >-
              가입은 시스템 관리자의 유효한 이메일 초대로만 가능합니다. 회원은 정확한 정보를 입력하고 비밀번호와 계정을 안전하게 관리해야 합니다.
        - title: "서비스와 공개 범위"
          paragraphs:
            - >-
              회원은 책장·독서 기록을 관리하고 짹·댓글과 동아리 활동에 참여할 수 있습니다. 개인 글과 책장의 공개 범위, 동아리의 유형·운영 상태·회원 자격에 따라 열람과 참여 권한이 달라집니다. 공개 콘텐츠는 서비스의 접근 권한에 따라 다른 이용자에게 표시될 수 있습니다.
        - title: "회원의 책임"
          paragraphs:
            - >-
              회원은 자신의 게시물과 공개 설정에 책임을 집니다. 타인의 권리·개인정보를 침해하거나 사칭·괴롭힘·위협·스팸 등 피해를 주는 활동을 해서는 안 됩니다.
        - title: "운영 조치"
          paragraphs:
            - >-
              운영자는 기존 정책에 따라 게시물·댓글을 숨기거나 복구하고 계정 또는 동아리 운영을 정지·복구할 수 있습니다. 동아리 관리자는 해당 동아리의 회원 활동과 콘텐츠를 관리할 수 있습니다.
        - title: "탈퇴와 콘텐츠"
          paragraphs:
            - >-
              탈퇴하면 로그인과 새 활동이 중단됩니다. 기존 글·댓글은 익명 작성자의 콘텐츠로 남을 수 있으며, 개별 콘텐츠 삭제는 탈퇴와 별도로 처리됩니다.
        - title: "약관 변경"
          paragraphs:
            - >-
              약관을 변경하면 변경 내용과 시행일을 이 페이지에 게시합니다.
