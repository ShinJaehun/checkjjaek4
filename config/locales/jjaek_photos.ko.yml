    daily_limit: 오늘 올릴 수 있는 사진 수를 초과했습니다. 새로 선택한 사진을 제거하거나 내일 다시 시도해 주세요.
    retained_limit: 보관할 수 있는 사진 수를 초과했습니다. 기존 사진이나 새로 선택한 사진을 줄인 뒤 다시 저장해 주세요.
    storage_limit: 서비스 전체 사진 저장 공간이 부족합니다. 새로 선택한 사진을 제거하거나 나중에 다시 시도해 주세요.
    upload_failed: 사진을 저장하지 못했습니다. 잠시 후 다시 시도해 주세요.
    invalid_removal: 제거할 사진을 확인해 주세요.
    no_requote: 다시짹에는 새 사진을 첨부할 수 없습니다.
    open: "사진 %{number} 확대"
    close: 사진 닫기
